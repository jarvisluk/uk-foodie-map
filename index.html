<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🇬🇧 英留美食地图</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇬🇧</text></svg>">
  <link rel="stylesheet" href="assets/vendor/leaflet.css" />
  <link rel="stylesheet" href="assets/vendor/MarkerCluster.css" />
  <link rel="stylesheet" href="assets/vendor/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>

<!-- Full-screen map -->
<div id="map"></div>

<!-- ===== LEFT PANEL ===== -->
<div class="float-panel float-left" id="leftPanel">
  <!-- Desktop toggle button (floating beside panel) -->
  <button class="panel-toggle toggle-left" id="toggleLeft" title="折叠/展开筛选列表">
    <span class="toggle-icon" id="toggleLeftIcon">◀</span>
    <span class="toggle-label" id="toggleLeftLabel">筛选列表</span>
  </button>

  <div class="panel-inner" id="leftPanelInner">
    <!-- Mobile Sheet Handle Bar -->
    <div class="sheet-handle-bar" id="sheetHandleBar" title="点击或拖动切换展开/收起">
      <span class="sheet-handle-pill"></span>
    </div>

    <!-- Branding -->
    <div class="panel-brand" id="panelBrand">
      <span class="brand-flag">🇬🇧</span>
      <div class="brand-meta">
        <div class="brand-name">英留美食地图</div>
        <div class="brand-sub">137 家真实探店 · 250+ 实拍图</div>
      </div>
      <button class="btn-lucky-header" id="btnLuckyHeader" title="今天吃什么？🎲">🎲 随机</button>
    </div>

    <!-- Search -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input"
             placeholder="搜索餐厅、菜系、邮编…" autocomplete="off" />
      <button class="search-clear" id="searchClear">✕</button>
    </div>

    <!-- Rating chips -->
    <div class="chip-group" id="ratingChips">
      <button class="chip active" data-rating="all">全部</button>
      <button class="chip chip-star" data-rating="star">🌟 必吃</button>
      <button class="chip chip-up" data-rating="thumb_up">👍 推荐</button>
      <button class="chip chip-down" data-rating="thumb_down">👎 避坑</button>
      <button class="chip chip-closed" data-rating="closed">⚠️ 关门</button>
    </div>

    <!-- City chips -->
    <div class="chip-group" id="cityChips">
      <button class="chip active" data-city="all">全英</button>
      <button class="chip" data-city="伦敦">伦敦</button>
      <button class="chip" data-city="爱丁堡">爱丁堡</button>
      <button class="chip" data-city="曼彻斯特">曼城</button>
      <button class="chip" data-city="剑桥">剑桥</button>
      <button class="chip" data-city="牛津">牛津</button>
      <button class="chip" data-city="伯明翰">伯明翰</button>
      <button class="chip" data-city="格拉斯哥">格拉斯哥</button>
      <button class="chip" data-city="康沃尔">康沃尔</button>
    </div>

    <!-- London area -->
    <div id="londonAreaWrap" class="area-row">
      <select id="londonAreaSelect" class="area-select">
        <option value="all">伦敦 · 全部区域</option>
      </select>
    </div>

    <!-- Category chips -->
    <div class="chip-group" id="categoryChips">
      <button class="chip active" data-category="all">全品类</button>
      <button class="chip" data-category="中餐">🥢 中餐</button>
      <button class="chip" data-category="亚洲菜">🍜 亚洲</button>
      <button class="chip" data-category="西餐">🥩 西餐</button>
      <button class="chip" data-category="甜品饮品">🧋 甜品</button>
      <button class="chip" data-category="酒吧夜生活">🍸 酒吧</button>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <span>找到 <strong id="visibleCount">0</strong> 家</span>
      <span><strong id="totalPhotosCount">0</strong> 张图</span>
      <button class="btn-lucky" id="btnLucky">🎲 随手抽</button>
    </div>

    <!-- Restaurant list -->
    <div class="resto-list" id="restoList"></div>
  </div>
</div>

<!-- ===== RIGHT PANEL (Detail Drawer) ===== -->
<div class="float-panel float-right collapsed" id="rightPanel">
  <button class="panel-toggle toggle-right" id="toggleRight" title="收起详情">
    <span id="toggleRightIcon">▶</span>
  </button>
  <div class="panel-inner" id="rightPanelInner">
    <!-- Drawer Header Bar -->
    <div class="drawer-header-bar" id="drawerHeaderBar">
      <button class="drawer-back-btn" id="drawerBackBtn" title="返回列表">
        <span class="back-arrow">‹</span> 返回列表
      </button>
      <div class="drawer-header-title" id="drawerHeaderTitle">探店详情</div>
      <button class="drawer-close-btn" id="drawerCloseBtn" title="关闭详情">✕</button>
    </div>

    <div id="drawerContent">
      <div class="drawer-placeholder">
        <div style="font-size:48px">🗺️</div>
        <div style="font-weight:600;margin-top:12px">点击地图图钉</div>
        <div style="font-size:13px;color:var(--text-muted);margin-top:6px">或左侧餐厅卡片<br>查看探店详情</div>
      </div>
    </div>
  </div>
</div>

<!-- Mobile backdrop -->
<div class="mobile-backdrop" id="mobileBackdrop"></div>

<!-- Map tool buttons (floating, top-right) -->
<div class="map-fab-group">
  <button class="map-fab" id="btnThemeToggle" title="切换深色模式">🌙</button>
  <button class="map-fab" id="btnLocateMe" title="定位我的位置">🎯</button>
  <button class="map-fab" id="btnResetMap" title="重置视角">🏠</button>
</div>

<!-- Lightbox -->
<div class="lightbox-modal" id="lightboxModal">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>
  <button class="lightbox-nav lightbox-next" id="lightboxNext">›</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="" />
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<!-- Lucky modal -->
<div class="lucky-modal" id="luckyModal">
  <div class="lucky-card" id="luckyCard"></div>
</div>

<!-- Toast -->
<div class="toast-msg" id="toastMsg"></div>

<script src="assets/vendor/leaflet.js"></script>
<script src="assets/vendor/leaflet.markercluster.js"></script>
<script src="data/restaurants.js"></script>
<script>
  if (!window.RESTAURANTS_DATA) {
    document.write('<script src="restaurants.js"><\/script>');
  }
</script>
<script src="app.js"></script>
</body>
</html>
